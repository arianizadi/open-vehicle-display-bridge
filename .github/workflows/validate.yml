# SPDX-License-Identifier: GPL-3.0-or-later
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile tools
        run: python3 -m compileall -q tools
      - name: Validate repository
        run: python3 tools/validate_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests/unit -p "test_*.py"
      - name: Report manifest compatibility changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$base"...HEAD -- 'protocol/manifests/*.json' |
          while IFS= read -r manifest; do
            [ "$manifest" = "protocol/manifests/vehicle-manifest.schema.json" ] && continue
            if git cat-file -e "$base:$manifest" 2>/dev/null; then
              before="$(mktemp)"
              git show "$base:$manifest" > "$before"
              python3 tools/compare_vehicle_manifests.py "$before" "$manifest"
            else
              echo "NEW MANIFEST: $manifest (full review required)"
            fi
          done
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD 2>/dev/null || git diff --check
